openapi: 3.1.0
info:
  title: CHIFAA E3
  version: "0.1"
servers:
- url: /
paths:
  /api/chat/sessions:
    get:
      tags:
      - chat-controller
      operationId: sessions
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
        "401":
          description: Authentication required or expired
        "403":
          description: Access denied
      security:
      - bearer: []
    post:
      tags:
      - chat-controller
      operationId: create
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          description: Authentication required or expired
        "403":
          description: Access denied
      security:
      - bearer: []
  /api/chat/sessions/{id}/messages:
    get:
      tags:
      - chat-controller
      operationId: messages
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Entry"
        "401":
          description: Authentication required or expired
        "403":
          description: Access denied
      security:
      - bearer: []
    post:
      tags:
      - chat-controller
      operationId: send
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Answer"
        "401":
          description: Authentication required or expired
        "403":
          description: Access denied
      security:
      - bearer: []
  /api/chat/messages/{id}/feedback:
    post:
      tags:
      - chat-controller
      operationId: rate
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackRequest"
        required: true
      responses:
        "204":
          description: No Content
        "401":
          description: Authentication required or expired
        "403":
          description: Access denied
      security:
      - bearer: []
  /api/auth/logout:
    post:
      tags:
      - local-authentication
      operationId: logout
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Authentication required or expired
        "403":
          description: Access denied
      security:
      - bearer: []
  /api/auth/login:
    post:
      tags:
      - local-authentication
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Login"
  /api/admin/organisations:
    get:
      tags:
      - admin-organisation-controller
      operationId: list
      parameters:
      - name: stale
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 25
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Results"
        "401":
          description: Authentication required or expired
        "403":
          description: Access denied
      security:
      - bearer: []
    post:
      tags:
      - admin-organisation-controller
      operationId: create_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganisationRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OrganisationResponse"
        "401":
          description: Authentication required or expired
        "403":
          description: Access denied
      security:
      - bearer: []
  /api/admin/organisations/{id}/verify:
    post:
      tags:
      - admin-organisation-controller
      operationId: verify
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Verification"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OrganisationResponse"
        "401":
          description: Authentication required or expired
        "403":
          description: Access denied
      security:
      - bearer: []
  /api/admin/safety-events/{id}:
    get:
      tags:
      - safety-event-controller
      operationId: get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SafetyEvent"
        "401":
          description: Authentication required or expired
        "403":
          description: Access denied
      security:
      - bearer: []
    patch:
      tags:
      - safety-event-controller
      operationId: patch
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Update"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SafetyEvent"
        "401":
          description: Authentication required or expired
        "403":
          description: Access denied
      security:
      - bearer: []
  /api/admin/organisations/{id}:
    patch:
      tags:
      - admin-organisation-controller
      operationId: update
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganisationRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OrganisationResponse"
        "401":
          description: Authentication required or expired
        "403":
          description: Access denied
      security:
      - bearer: []
  /api/organisations:
    get:
      tags:
      - organisation-controller
      operationId: list_1
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
          default: ""
      - name: governorate
        in: query
        required: false
        schema:
          type: string
          default: ""
      - name: category
        in: query
        required: false
        schema:
          type: string
          default: ""
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 25
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Results"
  /api/organisations/{id}:
    get:
      tags:
      - organisation-controller
      operationId: get_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OrganisationResponse"
  /api/health:
    get:
      tags:
      - health-controller
      operationId: health
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: string
  /api/admin/safety-events:
    get:
      tags:
      - safety-event-controller
      operationId: list_2
      parameters:
      - name: severity
        in: query
        required: false
        schema:
          type: string
          default: ""
      - name: status
        in: query
        required: false
        schema:
          type: string
          default: ""
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SafetyEvent"
        "401":
          description: Authentication required or expired
        "403":
          description: Access denied
      security:
      - bearer: []
  /api/admin/safety-events/statistics:
    get:
      tags:
      - safety-event-controller
      operationId: statistics
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Statistics"
        "401":
          description: Authentication required or expired
        "403":
          description: Access denied
      security:
      - bearer: []
  /api/admin/safety-events/reviewers:
    get:
      tags:
      - safety-event-controller
      operationId: reviewers
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reviewer"
        "401":
          description: Authentication required or expired
        "403":
          description: Access denied
      security:
      - bearer: []
  /api/admin/organisations/statistics:
    get:
      tags:
      - admin-organisation-controller
      operationId: statistics_1
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: integer
                  format: int64
        "401":
          description: Authentication required or expired
        "403":
          description: Access denied
      security:
      - bearer: []
components:
  schemas:
    Session:
      type: object
      properties:
        id:
          type: string
          format: uuid
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        preview:
          type: string
    ChatRequest:
      type: object
      properties:
        requestId:
          type: string
          format: uuid
        text:
          type: string
          maxLength: 2000
          minLength: 0
      required:
      - requestId
      - text
    Answer:
      type: object
      properties:
        userMessage:
          $ref: "#/components/schemas/Message"
        assistant:
          $ref: "#/components/schemas/Entry"
    Entry:
      type: object
      properties:
        message:
          $ref: "#/components/schemas/Message"
        reference:
          $ref: "#/components/schemas/Reference"
        showDirectory:
          type: boolean
        resources:
          type: array
          items:
            $ref: "#/components/schemas/Resource"
    Message:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        contentId:
          type: string
          format: uuid
        senderRole:
          type: string
        messageTimestamp:
          type: string
          format: date-time
        messageText:
          type: string
        detectedLanguage:
          type: string
        topicTag:
          type: string
        distressFlag:
          type: boolean
        rephraseFlag:
          type: boolean
        responseLatencyMs:
          type: integer
          format: int64
        userFeedback:
          type: integer
          format: int32
    Reference:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        body:
          type: string
        source:
          type: string
        reviewedDate:
          type: string
          format: date
        fictional:
          type: boolean
        version:
          type: integer
          format: int32
    Resource:
      type: object
      properties:
        name:
          type: string
        url:
          type: string
          format: uri
    FeedbackRequest:
      type: object
      properties:
        rating:
          type: integer
          format: int32
          maximum: 5
          minimum: 1
      required:
      - rating
    Credentials:
      type: object
      properties:
        username:
          type: string
          maxLength: 100
          minLength: 0
        password:
          type: string
          maxLength: 72
          minLength: 0
        staff:
          type: boolean
      required:
      - password
      - username
    Login:
      type: object
      properties:
        token:
          type: string
        role:
          type: string
        expiresAt:
          type: string
          format: date-time
    OrganisationRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 180
          minLength: 0
        serviceType:
          type: string
          maxLength: 40
          minLength: 0
        governorate:
          type: string
          minLength: 1
        contactPhone:
          type: string
          pattern: "^$|[+0-9() -]{5,32}"
        address:
          type: string
          maxLength: 300
          minLength: 0
        cost:
          type: string
          minLength: 1
          pattern: FREE|COVERED_BY_CNAM|PAID|UNKNOWN
        languages:
          type: array
          items:
            type: string
            minLength: 1
          maxItems: 3
          minItems: 0
      required:
      - cost
      - governorate
      - languages
      - name
      - serviceType
    OrganisationResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        serviceType:
          type: string
        governorate:
          type: string
        contactPhone:
          type: string
        address:
          type: string
        cost:
          type: string
        languages:
          type: array
          items:
            type: string
        verifiedDate:
          type: string
          format: date
        verificationMethod:
          type: string
        fictional:
          type: boolean
        verificationDue:
          type: boolean
    Verification:
      type: object
      properties:
        method:
          type: string
          maxLength: 120
          minLength: 0
      required:
      - method
    Update:
      type: object
      properties:
        reviewerId:
          type: string
          format: uuid
        orgId:
          type: string
          pattern: "ORG-[0-9]{3}"
        actionTaken:
          type: string
          maxLength: 2000
          minLength: 0
        referralOutcome:
          type: string
          maxLength: 2000
          minLength: 0
        status:
          type: string
          pattern: Open|In progress|Resolved|Closed
    SafetyEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userPid:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        reviewerId:
          type: string
          format: uuid
        orgId:
          type: string
        triggerType:
          type: string
        severity:
          type: string
        flaggedAt:
          type: string
          format: date-time
        status:
          type: string
        actionTaken:
          type: string
        referralOutcome:
          type: string
        resolvedAt:
          type: string
          format: date-time
        resolutionSeconds:
          type: integer
          format: int64
    Results:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrganisationResponse"
        total:
          type: integer
          format: int64
        page:
          type: integer
          format: int32
        hasNext:
          type: boolean
    Statistics:
      type: object
      properties:
        open:
          type: integer
          format: int64
        critical:
          type: integer
          format: int64
        resolved:
          type: integer
          format: int64
    Reviewer:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
