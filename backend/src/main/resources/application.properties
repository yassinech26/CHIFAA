spring.datasource.url=${CHIFAA_DB_URL:jdbc:postgresql://localhost:5432/chifaa}
spring.datasource.username=${CHIFAA_DB_USER:chifaa_app}
spring.datasource.password=${CHIFAA_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
chifaa.library-url=${CHIFAA_LIBRARY_URL:}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'
spring.mvc.problemdetails.enabled=true
server.address=${CHIFAA_BIND:127.0.0.1}
chifaa.phone-key=${CHIFAA_PHONE_KEY}
chifaa.lookup-key=${CHIFAA_LOOKUP_KEY}
chifaa.demo-otp=${CHIFAA_DEMO_OTP:false}
spring.datasource.hikari.data-source-properties.logServerErrorDetail=false
spring.jackson.deserialization.accept-float-as-int=false
spring.security.oauth2.resourceserver.jwt.issuer-uri=${CHIFAA_JWT_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.audiences=${CHIFAA_JWT_AUDIENCE}
