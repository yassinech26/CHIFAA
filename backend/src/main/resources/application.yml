server:
  error:
    include-message: never
    include-stacktrace: never
spring:
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: ${CHIFAA_DB_URL:jdbc:postgresql://localhost:5432/chifaa_e3}
    username: ${CHIFAA_DB_USER:chifaa}
    password: ${CHIFAA_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/compatibility,classpath:db/migration
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
